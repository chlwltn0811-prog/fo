<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway Verification</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 틀렸을 때 카드 흔들림 애니메이션 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-8px); }
      30%, 60%, 90% { transform: translateX(8px); }
    }

    .shake-animation {
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 성공 시 페이드 아웃 */
    .fade-out {
      opacity: 0;
      transform: scale(0.97);
      transition: all 0.5s ease-in-out;
    }
  </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- 배경 장식 글로우 효과 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
  </div>

  <!-- 메인 게이트웨이 카드 -->
  <main id="card-container" class="relative z-10 w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 sm:p-10 shadow-2xl transition-all duration-300">
    
    <!-- 아이콘 뱃지 -->
    <div class="flex justify-center mb-6">
      <div id="icon-box" class="w-14 h-14 rounded-2xl bg-slate-800 border border-slate-700/60 flex items-center justify-center shadow-inner transition-colors duration-300">
        <i data-lucide="lock" class="w-6 h-6 text-indigo-400 transition-colors duration-300" id="main-icon"></i>
      </div>
    </div>

    <!-- 안내 문구 -->
    <div class="text-center mb-8">
      <h1 class="text-lg sm:text-xl font-semibold tracking-tight text-slate-100 mb-2">
        &lt;비밀번호를 입력하고 엔터를 누르시오.&gt;
      </h1>
      <p class="text-xs sm:text-sm text-slate-400">
        접근 권한 확인을 위해 패스워드를 입력해주세요.
      </p>
    </div>

    <!-- 폼 입력 영역 -->
    <form id="password-form" class="space-y-4" onsubmit="return false;">
      <div class="relative">
        <input
          type="password"
          id="password-input"
          autocomplete="off"
          placeholder="비밀번호 입력..."
          class="w-full px-5 py-4 bg-slate-950/70 border border-slate-800 rounded-2xl text-slate-100 placeholder:text-slate-500 text-center tracking-wider text-base sm:text-lg focus:outline-none focus:border-indigo-500/80 focus:ring-4 focus:ring-indigo-500/15 transition-all duration-200"
          autofocus
        />
        
        <!-- 눈 모양 비밀번호 보기/숨기기 토글 버튼 -->
        <button 
          type="button" 
          id="toggle-visibility" 
          tabindex="-1"
          aria-label="비밀번호 보기 토글"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors p-1"
        >
          <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 에러 & 안내 메시지 영역 -->
      <div class="min-h-[24px] text-center">
        <p id="error-message" class="text-xs sm:text-sm text-rose-400 font-medium hidden flex items-center justify-center gap-1.5">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span>비밀번호가 일치하지 않습니다.</span>
        </p>
        <p id="success-message" class="text-xs sm:text-sm text-emerald-400 font-medium hidden flex items-center justify-center gap-1.5">
          <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
          <span>인증 성공! 이동 중입니다...</span>
        </p>
      </div>

      <!-- 제출 버튼 (엔터 외에도 클릭 가능) -->
      <button
        type="submit"
        id="submit-btn"
        class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-medium rounded-2xl shadow-lg shadow-indigo-600/25 transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
      >
        <span>입장하기</span>
        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
      </button>
    </form>

    <!-- 하단 힌트/상태 -->
    <div class="mt-8 text-center text-xs text-slate-500 border-t border-slate-800/60 pt-4">
      보안 게이트웨이 시스템 &bull; Enter 키를 누르면 바로 확인됩니다.
    </div>
  </main>

  <script>
    /* ========================================================
     * [설정 변수]
     * 이동하고자 하는 목적지 URL과 올바른 비밀번호를 설정하세요.
     * ======================================================== */
    const TARGET_URL = 'https://example.com'; // <--- 나중에 첨부할 링크 주소로 변경하세요!
    const CORRECT_PASSWORD = '래';

    // DOM 요소 캐싱
    const container = document.getElementById('card-container');
    const form = document.getElementById('password-form');
    const input = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');
    const iconBox = document.getElementById('icon-box');
    const mainIcon = document.getElementById('main-icon');
    const toggleBtn = document.getElementById('toggle-visibility');
    const submitBtn = document.getElementById('submit-btn');

    // Lucide 아이콘 초기화
    lucide.createIcons();

    // 비밀번호 가시성 토글 기능
    let isVisible = false;
    toggleBtn.addEventListener('click', () => {
      isVisible = !isVisible;
      input.type = isVisible ? 'text' : 'password';
      
      const eyeIcon = document.getElementById('eye-icon');
      if (isVisible) {
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // 비밀번호 검증 핸들러
    function verifyPassword() {
      const enteredValue = input.value.trim();

      // 일치할 경우
      if (enteredValue === CORRECT_PASSWORD) {
        // UI 성공 상태 업데이트
        errorMsg.classList.add('hidden');
        successMsg.classList.remove('hidden');
        input.classList.remove('border-rose-500/80', 'focus:border-rose-500');
        input.classList.add('border-emerald-500/80', 'text-emerald-400');
        
        iconBox.classList.remove('bg-slate-800', 'border-slate-700/60');
        iconBox.classList.add('bg-emerald-500/20', 'border-emerald-500/40');
        mainIcon.classList.remove('text-indigo-400');
        mainIcon.classList.add('text-emerald-400');
        mainIcon.setAttribute('data-lucide', 'unlock');
        lucide.createIcons();

        input.disabled = true;
        submitBtn.disabled = true;

        // 부드러운 페이드 아웃 후 목적지 링크로 이동
        setTimeout(() => {
          container.classList.add('fade-out');
        }, 400);

        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 800);

      } else {
        // 불일치할 경우 (실패)
        successMsg.classList.add('hidden');
        errorMsg.classList.remove('hidden');
        
        // 인풋 에러 스타일 적용
        input.classList.add('border-rose-500/80');
        input.focus();
        input.select();

        // 흔들림 애니메이션 트리거
        container.classList.remove('shake-animation');
        void container.offsetWidth; // DOM reflow 강제
        container.classList.add('shake-animation');

        // 흔들림 완료 후 애니메이션 클래스 제거
        setTimeout(() => {
          container.classList.remove('shake-animation');
        }, 500);
      }
    }

    // 폼 제출 이벤트
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      verifyPassword();
    });

    // 한글 입력(IME 조합) 중 엔터 입력 시 두 번 실행 방지
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (e.isComposing) return; // 조합 중이면 종료
        e.preventDefault();
        verifyPassword();
      }
    });

    // 입력 시 에러 표시 초기화
    input.addEventListener('input', () => {
      if (!errorMsg.classList.contains('hidden')) {
        errorMsg.classList.add('hidden');
        input.classList.remove('border-rose-500/80');
      }
    });
  </script>
</body>
</html>
